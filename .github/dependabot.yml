version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      # Friday, so PRs are ready for the Saturday PR review.
      day: "friday"
      time: "06:00"
      timezone: "Europe/London"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
      # TypeScript 7 (native compiler) is not yet supported by @astrojs/check,
      # whose peer dependency caps TypeScript at ^5 || ^6. See PR #373.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
    groups:
      all:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "Europe/London"
    groups:
      actions:
        patterns:
          - "*"
